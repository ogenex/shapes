<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Practice</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
    <header class="userbar wide" id="userBar"></header>

    <main class="home">
        <section class="hero">
            <div class="hero-text">
                <p class="eyebrow">Maths Practice</p>
                <h1 id="greeting">Welcome</h1>
                <p class="subtitle" id="subtitle">Pick a topic to practise</p>
            </div>
            <div class="hero-stats hidden" id="heroStats"></div>
        </section>

        <section class="next-up hidden" id="nextUp" aria-label="Suggested next topic"></section>

        <h2 class="section-title">Topics</h2>
        <div class="topic-grid" id="topicGrid">
            <p class="empty-state">Loading topics…</p>
        </div>
    </main>

    <script type="module" src="assets/js/home.js"></script>
</body>
</html>
