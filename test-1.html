<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 7 NAPLAN Maths Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .progress-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        .score {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        .question-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #222;
            line-height: 1.4;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option {
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            background: white;
            text-align: left;
        }
        
        .option:hover:not(:disabled) {
            border-color: #999;
            background: #f9f9f9;
        }
        
        .option:disabled {
            cursor: default;
        }
        
        .option.selected {
            font-weight: 600;
        }
        
        .option.correct {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }
        
        .option.incorrect {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }
        
        .feedback {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .feedback.correct {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
        
        .feedback.incorrect {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        
        .feedback-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .button {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #999;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button:hover {
            background: #f5f5f5;
            border-color: #333;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .hidden {
            display: none;
        }
        
        .results-screen {
            text-align: center;
        }
        
        .results-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }
        
        .results-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .score-display {
            font-size: 56px;
            font-weight: 700;
            margin: 20px 0;
            color: #2196f3;
        }
        
        .score-detail {
            font-size: 16px;
            margin-bottom: 30px;
            color: #222;
        }
        
        .score-detail strong {
            font-weight: 700;
        }
        
        .feedback-message {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="testScreen">
            <div class="progress-bar">
                <span class="progress-text">Question <span id="currentQ">1</span>/<span id="totalQ">8</span></span>
                <span class="score">Score: <span id="scoreDisplay">0</span></span>
            </div>
            
            <h2 class="question-title" id="questionText"></h2>
            
            <div class="options" id="optionsContainer"></div>
            
            <div id="feedbackContainer" class="hidden"></div>
            
            <button class="button" id="nextButton" class="hidden" onclick="nextQuestion()">Next question</button>
        </div>
        
        <div id="resultsScreen" class="results-screen hidden">
            <h2 class="results-title">Test complete</h2>
            <p class="results-subtitle">Here's how you did</p>
            
            <div class="score-display" id="percentageDisplay">75%</div>
            
            <div class="score-detail">
                You got <strong><span id="correctCount">6</span> out of <span id="totalCount">8</span></strong> correct
            </div>
            
            <div class="feedback-message" id="feedbackMessage"></div>
            
            <button class="button" onclick="restartTest()">Try again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is 3/4 + 1/8?",
                options: ["4/12", "7/8", "4/8", "7/4"],
                correct: 1,
                explanation: "Convert to common denominator: 3/4 = 6/8, so 6/8 + 1/8 = 7/8"
            },
            {
                question: "A shirt costs $45. It's on sale for 20% off. What's the sale price?",
                options: ["$25", "$36", "$40", "$9"],
                correct: 1,
                explanation: "20% of $45 = $9. So $45 - $9 = $36"
            },
            {
                question: "What is the next number in the sequence: 2, 5, 10, 17, ?",
                options: ["24", "25", "26", "28"],
                correct: 2,
                explanation: "Differences: +3, +5, +7, +9. So 17 + 9 = 26"
            },
            {
                question: "If 5x = 35, what is x?",
                options: ["7", "30", "40", "175"],
                correct: 0,
                explanation: "Divide both sides by 5: x = 35 ÷ 5 = 7"
            },
            {
                question: "What is 0.6 × 0.4?",
                options: ["1.0", "0.24", "0.10", "2.4"],
                correct: 1,
                explanation: "Convert: 6/10 × 4/10 = 24/100 = 0.24"
            },
            {
                question: "The angles in a triangle sum to 180°. If two angles are 60° and 55°, what is the third?",
                options: ["55°", "65°", "120°", "115°"],
                correct: 1,
                explanation: "180° - 60° - 55° = 65°"
            },
            {
                question: "What is 15% of 200?",
                options: ["15", "30", "45", "50"],
                correct: 1,
                explanation: "15% = 15/100. 15/100 × 200 = 30"
            },
            {
                question: "A rectangle has length 12 cm and width 8 cm. What is its area?",
                options: ["20 cm²", "40 cm²", "96 cm²", "120 cm²"],
                correct: 2,
                explanation: "Area = length × width = 12 × 8 = 96 cm²"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        function loadQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('totalQ').textContent = questions.length;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = String.fromCharCode(65 + index) + '. ' + option;
                button.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(button);
            });
            
            document.getElementById('feedbackContainer').classList.add('hidden');
            document.getElementById('nextButton').classList.add('hidden');
            selectedAnswer = null;
            answered = false;
        }

        function selectAnswer(index) {
            if (answered) return;
            
            const question = questions[currentQuestion];
            selectedAnswer = index;
            answered = true;
            
            const options = document.querySelectorAll('.option');
            options.forEach(btn => btn.disabled = true);
            
            const isCorrect = index === question.correct;
            if (isCorrect) {
                score++;
            }
            
            options[index].classList.add(isCorrect ? 'correct' : 'incorrect');
            options[index].classList.add('selected');
            
            document.getElementById('scoreDisplay').textContent = score;
            
            const feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.innerHTML = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Not quite'}</div>
                    <div>${question.explanation}</div>
                </div>
            `;
            feedbackContainer.classList.remove('hidden');
            
            document.getElementById('nextButton').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('testScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('percentageDisplay').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = score;
            document.getElementById('totalCount').textContent = questions.length;
            
            let message = '';
            if (percentage >= 80) {
                message = 'Excellent work! You\'ve demonstrated strong understanding of Year 7 maths concepts.';
            } else if (percentage >= 60) {
                message = 'Good effort! Review the questions you missed to strengthen those concepts.';
            } else {
                message = 'Keep practicing! Focus on the areas where you found the questions challenging.';
            }
            document.getElementById('feedbackMessage').textContent = message;
        }

        function restartTest() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;
            
            document.getElementById('testScreen').classList.remove('hidden');
            document.getElementById('resultsScreen').classList.add('hidden');
            
            loadQuestion();
        }

        // Start the test
        loadQuestion();
    </script>
</body>
</html>
