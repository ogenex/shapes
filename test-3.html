<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year 7 NAPLAN Maths Test - Set 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .progress-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        .score {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        .question-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #222;
            line-height: 1.5;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option {
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            background: white;
            text-align: left;
        }
        
        .option:hover:not(:disabled) {
            border-color: #999;
            background: #f9f9f9;
        }
        
        .option:disabled {
            cursor: default;
        }
        
        .option.selected {
            font-weight: 600;
        }
        
        .option.correct {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }
        
        .option.incorrect {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }
        
        .feedback {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .feedback.correct {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
        
        .feedback.incorrect {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        
        .feedback-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .button {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #999;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .button:hover {
            background: #f5f5f5;
            border-color: #333;
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .hidden {
            display: none;
        }
        
        .results-screen {
            text-align: center;
        }
        
        .results-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }
        
        .results-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .score-display {
            font-size: 56px;
            font-weight: 700;
            margin: 20px 0;
            color: #2196f3;
        }
        
        .score-detail {
            font-size: 16px;
            margin-bottom: 30px;
            color: #222;
        }
        
        .score-detail strong {
            font-weight: 700;
        }
        
        .feedback-message {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="testScreen">
            <div class="progress-bar">
                <span class="progress-text">Question <span id="currentQ">1</span>/<span id="totalQ">30</span></span>
                <span class="score">Score: <span id="scoreDisplay">0</span></span>
            </div>
            
            <h2 class="question-title" id="questionText"></h2>
            
            <div class="options" id="optionsContainer"></div>
            
            <div id="feedbackContainer" class="hidden"></div>
            
            <button class="button" id="nextButton" class="hidden" onclick="nextQuestion()">Next question</button>
        </div>
        
        <div id="resultsScreen" class="results-screen hidden">
            <h2 class="results-title">Test complete</h2>
            <p class="results-subtitle">Here's how you did</p>
            
            <div class="score-display" id="percentageDisplay">75%</div>
            
            <div class="score-detail">
                You got <strong><span id="correctCount">6</span> out of <span id="totalCount">30</span></strong> correct
            </div>
            
            <div class="feedback-message" id="feedbackMessage"></div>
            
            <button class="button" onclick="restartTest()">Try again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the volume of a cube with side length 3 cm?",
                options: ["9 cm³", "27 cm³", "36 cm³", "81 cm³"],
                correct: 1,
                explanation: "Volume = side³ = 3³ = 3 × 3 × 3 = 27 cm³"
            },
            {
                question: "If I flip a fair coin, what's the probability of getting heads?",
                options: ["0", "1/4", "1/2", "1"],
                correct: 2,
                explanation: "A fair coin has two equally likely outcomes, so P(heads) = 1/2"
            },
            {
                question: "What are the coordinates of point A on a graph at 3 units right and 2 units up?",
                options: ["(2, 3)", "(3, 2)", "(0, 3)", "(3, 0)"],
                correct: 1,
                explanation: "Coordinates are written as (x, y), where x is right/left and y is up/down. So (3, 2)."
            },
            {
                question: "What is -5 + 3?",
                options: ["-8", "-2", "2", "8"],
                correct: 1,
                explanation: "Starting at -5 and moving 3 units toward zero gives -2"
            },
            {
                question: "What is 144 ÷ 12?",
                options: ["10", "12", "14", "16"],
                correct: 1,
                explanation: "144 ÷ 12 = 12"
            },
            {
                question: "Which fraction is equivalent to 2/3?",
                options: ["3/4", "4/6", "3/5", "5/8"],
                correct: 1,
                explanation: "2/3 = 4/6 (multiply both numerator and denominator by 2)"
            },
            {
                question: "If a bank account earns simple interest, and I invest $100 at 5% per year for 2 years, how much interest do I earn?",
                options: ["$5", "$10", "$50", "$100"],
                correct: 1,
                explanation: "Simple interest = Principal × Rate × Time = $100 × 0.05 × 2 = $10"
            },
            {
                question: "How many hours are in 240 minutes?",
                options: ["2", "3", "4", "5"],
                correct: 2,
                explanation: "240 minutes ÷ 60 minutes per hour = 4 hours"
            },
            {
                question: "A car travels 150 km in 3 hours. What's its average speed?",
                options: ["45 km/h", "50 km/h", "150 km/h", "450 km/h"],
                correct: 1,
                explanation: "Speed = Distance ÷ Time = 150 ÷ 3 = 50 km/h"
            },
            {
                question: "Two angles in a straight line sum to 180°. If one angle is 125°, what's the other?",
                options: ["55°", "65°", "75°", "125°"],
                correct: 0,
                explanation: "180° - 125° = 55° (these are supplementary angles)"
            },
            {
                question: "Which of these is a prime number?",
                options: ["4", "6", "11", "15"],
                correct: 2,
                explanation: "11 is only divisible by 1 and itself. 4, 6, and 15 have other factors."
            },
            {
                question: "What are the factors of 12?",
                options: ["1, 2, 3, 4, 6, 12", "1, 2, 6, 12", "1, 12", "2, 3, 4, 6"],
                correct: 0,
                explanation: "Factors of 12: 1×12, 2×6, 3×4. So: 1, 2, 3, 4, 6, 12"
            },
            {
                question: "What is √49?",
                options: ["7", "24.5", "49", "2401"],
                correct: 0,
                explanation: "√49 = 7 because 7 × 7 = 49"
            },
            {
                question: "Round 47.683 to the nearest whole number.",
                options: ["47", "47.6", "47.7", "48"],
                correct: 3,
                explanation: "The decimal part is 0.683, which is more than 0.5, so round up to 48"
            },
            {
                question: "What is 1/4 of 36?",
                options: ["9", "12", "18", "27"],
                correct: 0,
                explanation: "1/4 of 36 = 36 ÷ 4 = 9"
            },
            {
                question: "If x² = 16, what is x?",
                options: ["2", "4", "8", "16"],
                correct: 1,
                explanation: "We need a number that when multiplied by itself equals 16. That's 4 × 4 = 16"
            },
            {
                question: "What is the least common multiple (LCM) of 4 and 6?",
                options: ["2", "12", "24", "4"],
                correct: 1,
                explanation: "Multiples of 4: 4, 8, 12, 16... Multiples of 6: 6, 12, 18... LCM = 12"
            },
            {
                question: "A jacket is priced at $80. After a 15% discount, what's the new price?",
                options: ["$65", "$68", "$70", "$92"],
                correct: 1,
                explanation: "15% of $80 = $12. $80 - $12 = $68"
            },
            {
                question: "What is 3.5 × 2.4?",
                options: ["5.9", "6.0", "8.4", "8.9"],
                correct: 2,
                explanation: "3.5 × 2.4 = 35 × 24 ÷ 100 = 840 ÷ 100 = 8.4"
            },
            {
                question: "The mean of 5, 7, 9, and 11 is?",
                options: ["7", "8", "9", "32"],
                correct: 1,
                explanation: "(5 + 7 + 9 + 11) ÷ 4 = 32 ÷ 4 = 8"
            },
            {
                question: "Simplify: 5x + 3x - 2x",
                options: ["6x", "8x", "10x", "3x"],
                correct: 0,
                explanation: "5x + 3x - 2x = (5 + 3 - 2)x = 6x"
            },
            {
                question: "A bag contains 3 red balls and 5 blue balls. What's the probability of drawing a red ball?",
                options: ["3/5", "3/8", "5/8", "1/2"],
                correct: 1,
                explanation: "Total balls = 8. P(red) = 3/8"
            },
            {
                question: "What is 10² - 5²?",
                options: ["5", "25", "50", "75"],
                correct: 3,
                explanation: "10² = 100, 5² = 25, so 100 - 25 = 75"
            },
            {
                question: "If 2x + 3 = 11, what is x?",
                options: ["3", "4", "5", "8"],
                correct: 1,
                explanation: "2x = 11 - 3 = 8, so x = 8 ÷ 2 = 4"
            },
            {
                question: "What is the area of a triangle with base 8 cm and height 6 cm?",
                options: ["14 cm²", "24 cm²", "28 cm²", "48 cm²"],
                correct: 1,
                explanation: "Area = (base × height) ÷ 2 = (8 × 6) ÷ 2 = 48 ÷ 2 = 24 cm²"
            },
            {
                question: "Convert 3/4 to a percentage.",
                options: ["25%", "50%", "75%", "100%"],
                correct: 2,
                explanation: "3/4 = 0.75 = 75%"
            },
            {
                question: "What is -3 - (-5)?",
                options: ["-8", "-2", "2", "8"],
                correct: 2,
                explanation: "-3 - (-5) = -3 + 5 = 2 (subtracting a negative is like adding)"
            },
            {
                question: "What is the circumference of a circle with radius 5 cm? (Use π ≈ 3.14)",
                options: ["15.7 cm", "31.4 cm", "78.5 cm", "157 cm"],
                correct: 1,
                explanation: "Circumference = 2πr = 2 × 3.14 × 5 = 31.4 cm"
            },
            {
                question: "If a recipe makes 4 servings and uses 2 cups of flour, how much flour for 8 servings?",
                options: ["1 cup", "2 cups", "4 cups", "6 cups"],
                correct: 2,
                explanation: "Double the recipe, double the ingredients: 2 × 2 = 4 cups"
            },
            {
                question: "What is the greatest common divisor (GCD) of 18 and 24?",
                options: ["2", "3", "6", "12"],
                correct: 2,
                explanation: "Factors of 18: 1, 2, 3, 6, 9, 18. Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24. GCD = 6"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        function loadQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            document.getElementById('totalQ').textContent = questions.length;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option';
                button.textContent = String.fromCharCode(65 + index) + '. ' + option;
                button.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(button);
            });
            
            document.getElementById('feedbackContainer').classList.add('hidden');
            document.getElementById('nextButton').classList.add('hidden');
            selectedAnswer = null;
            answered = false;
        }

        function selectAnswer(index) {
            if (answered) return;
            
            const question = questions[currentQuestion];
            selectedAnswer = index;
            answered = true;
            
            const options = document.querySelectorAll('.option');
            options.forEach(btn => btn.disabled = true);
            
            const isCorrect = index === question.correct;
            if (isCorrect) {
                score++;
            }
            
            options[index].classList.add(isCorrect ? 'correct' : 'incorrect');
            options[index].classList.add('selected');
            
            document.getElementById('scoreDisplay').textContent = score;
            
            const feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.innerHTML = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    <div class="feedback-title">${isCorrect ? '✓ Correct!' : '✗ Not quite'}</div>
                    <div>${question.explanation}</div>
                </div>
            `;
            feedbackContainer.classList.remove('hidden');
            
            document.getElementById('nextButton').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('testScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('percentageDisplay').textContent = percentage + '%';
            document.getElementById('correctCount').textContent = score;
            document.getElementById('totalCount').textContent = questions.length;
            
            let message = '';
            if (percentage >= 80) {
                message = 'Excellent work! You\'ve demonstrated strong understanding of Year 7 maths concepts.';
            } else if (percentage >= 70) {
                message = 'Great effort! You\'re getting most concepts down. Review the questions you missed.';
            } else if (percentage >= 60) {
                message = 'Good attempt! Focus on the areas where you found the questions challenging.';
            } else {
                message = 'Keep practicing! Year 7 maths builds on these foundations. Try again soon.';
            }
            document.getElementById('feedbackMessage').textContent = message;
        }

        function restartTest() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;
            
            document.getElementById('testScreen').classList.remove('hidden');
            document.getElementById('resultsScreen').classList.add('hidden');
            
            loadQuestion();
        }

        // Start the test
        loadQuestion();
    </script>
</body>
</html>
